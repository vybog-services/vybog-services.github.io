<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="55%" stop-color="#F4F6FB"/>
      <stop offset="100%" stop-color="#E8EFFC"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3C8CF0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3C8CF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0050C8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0050C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A5FFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7A5FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0B1B3D" opacity="0.07"/>
    </pattern>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAFAFA" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#FAFAFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FAFAFA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base wash -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <rect width="1920" height="1080" fill="url(#dotgrid)"/>

  <!-- soft mesh blobs (right side weighted) -->
  <circle cx="1500" cy="280" r="520" fill="url(#blob1)"/>
  <circle cx="1300" cy="780" r="460" fill="url(#blob2)"/>
  <circle cx="1750" cy="640" r="380" fill="url(#blob3)"/>
  <circle cx="1100" cy="200" r="320" fill="url(#blob4)"/>

  <!-- design composition (right side) -->
  <g opacity="0.92">
    <!-- floating browser window -->
    <g transform="translate(1180, 220) rotate(-6)">
      <rect x="0" y="0" width="380" height="240" rx="18" fill="#fff" stroke="#E8EFFC" stroke-width="1.5"/>
      <rect x="0" y="0" width="380" height="36" rx="18" fill="#F4F6FB"/>
      <circle cx="18" cy="18" r="5" fill="#FF7A59"/>
      <circle cx="36" cy="18" r="5" fill="#F4C150"/>
      <circle cx="54" cy="18" r="5" fill="#16A34A"/>
      <rect x="160" y="11" width="160" height="14" rx="7" fill="#E8EFFC"/>
      <rect x="20" y="62" width="200" height="14" rx="3" fill="#1A1A1A" opacity="0.85"/>
      <rect x="20" y="88" width="280" height="8" rx="3" fill="#1A1A1A" opacity="0.18"/>
      <rect x="20" y="104" width="240" height="8" rx="3" fill="#1A1A1A" opacity="0.18"/>
      <rect x="20" y="120" width="180" height="8" rx="3" fill="#1A1A1A" opacity="0.18"/>
      <rect x="20" y="150" width="120" height="38" rx="19" fill="#0B1B3D"/>
      <rect x="38" y="166" width="84" height="8" rx="3" fill="#fff" opacity="0.95"/>
      <rect x="240" y="62" width="120" height="80" rx="10" fill="#3C8CF0" opacity="0.85"/>
      <circle cx="280" cy="100" r="16" fill="#fff" opacity="0.9"/>
      <rect x="240" y="160" width="120" height="34" rx="6" fill="#E8EFFC"/>
    </g>

    <!-- code-editor card -->
    <g transform="translate(1320, 540) rotate(4)">
      <rect x="0" y="0" width="360" height="220" rx="16" fill="#0B1B3D"/>
      <rect x="0" y="0" width="360" height="28" rx="16" fill="#122249"/>
      <circle cx="14" cy="14" r="4" fill="#FF7A59"/>
      <circle cx="28" cy="14" r="4" fill="#F4C150"/>
      <circle cx="42" cy="14" r="4" fill="#16A34A"/>
      <g font-family="JetBrains Mono, monospace" font-size="13">
        <text x="20" y="62" fill="#7AA7FF">function</text>
        <text x="92" y="62" fill="#fff">ship</text>
        <text x="125" y="62" fill="#BFC8DA">(team) {</text>
        <text x="34" y="86" fill="#7AA7FF">return</text>
        <text x="92" y="86" fill="#FFB779">'production'</text>
        <text x="194" y="86" fill="#BFC8DA">;</text>
        <text x="20" y="110" fill="#BFC8DA">}</text>
        <text x="20" y="150" fill="#7AA7FF">const</text>
        <text x="68" y="150" fill="#fff">hire</text>
        <text x="105" y="150" fill="#BFC8DA">= </text>
        <text x="125" y="150" fill="#FFB779">'on-demand'</text>
        <text x="210" y="150" fill="#BFC8DA">;</text>
        <text x="20" y="186" fill="#5A6FA6">// build • hire • ai</text>
      </g>
    </g>

    <!-- design palette card -->
    <g transform="translate(1490, 90) rotate(8)">
      <rect x="0" y="0" width="180" height="120" rx="14" fill="#fff" stroke="#E8EFFC"/>
      <rect x="14" y="14" width="40" height="40" rx="8" fill="#0050C8"/>
      <rect x="60" y="14" width="40" height="40" rx="8" fill="#3C8CF0"/>
      <rect x="106" y="14" width="40" height="40" rx="8" fill="#7A5FFF"/>
      <rect x="14" y="62" width="40" height="40" rx="8" fill="#FF7A59"/>
      <rect x="60" y="62" width="40" height="40" rx="8" fill="#16A34A"/>
      <rect x="106" y="62" width="40" height="40" rx="8" fill="#0B1B3D"/>
    </g>

    <!-- floating chip pills -->
    <g transform="translate(1100, 720)">
      <rect x="0" y="0" width="110" height="38" rx="19" fill="#fff" stroke="#E8EFFC"/>
      <circle cx="20" cy="19" r="6" fill="#0050C8"/>
      <text x="34" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">React</text>
    </g>
    <g transform="translate(1220, 760)">
      <rect x="0" y="0" width="118" height="38" rx="19" fill="#fff" stroke="#E8EFFC"/>
      <circle cx="20" cy="19" r="6" fill="#3C8CF0"/>
      <text x="34" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">Node.js</text>
    </g>
    <g transform="translate(1080, 820)">
      <rect x="0" y="0" width="138" height="38" rx="19" fill="#fff" stroke="#E8EFFC"/>
      <circle cx="20" cy="19" r="6" fill="#7A5FFF"/>
      <text x="34" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1A1A1A">AI Agents</text>
    </g>

    <!-- connector lines -->
    <g stroke="#3C8CF0" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4 6">
      <path d="M1380 460 Q1430 500 1500 540"/>
      <path d="M1580 220 Q1640 200 1670 150"/>
      <path d="M1240 740 Q1290 720 1340 700"/>
    </g>

    <!-- accent shapes -->
    <circle cx="1820" cy="180" r="34" fill="#FF7A59" opacity="0.85"/>
    <circle cx="1820" cy="180" r="22" fill="#FAFAFA"/>
    <rect x="1100" y="940" width="60" height="60" rx="14" fill="#0050C8" opacity="0.85" transform="rotate(15 1130 970)"/>
    <polygon points="1880,900 1920,940 1880,980 1840,940" fill="#7A5FFF" opacity="0.85"/>
    <circle cx="940" cy="900" r="14" fill="#16A34A" opacity="0.9"/>
  </g>

  <!-- left fade overlay so text stays readable -->
  <rect width="1920" height="1080" fill="url(#fadeLeft)"/>
</svg>
